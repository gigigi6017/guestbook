<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>
</head>
<body>

<h1>관리자 페이지</h1>

<!-- 관리자 로그인 영역 -->
<div id="loginArea">

    <h2>관리자 로그인</h2>

    <label>
        관리자 비밀번호:
        <input
                type="password"
                id="adminPassword"
                maxlength="4"
                placeholder="비밀번호 4자리"
        >
    </label>

    <button id="loginButton">로그인</button>

    <p id="loginMessage"></p>

</div>


<!-- 관리자 기능 영역 -->
<!-- 처음에는 숨겨놓는다. -->
<div id="adminArea" style="display: none;">

    <h2>방명록 관리</h2>

    <p>
        관리자 로그인에 성공했습니다.
    </p>

    <!-- 방명록 목록이 여기에 표시될 예정 -->
    <div id="guestbookList"></div>

</div>


<script src="admin.js"></script>

</body>
</html>
