<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <!-- 휴대폰 화면에 맞게 표시 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>방명록</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 15px;

            background-color: #f5f6f8;

            font-family:
                    Arial,
                    "Noto Sans KR",
                    sans-serif;

            color: #333;
        }

        /* 상단 메뉴 */
        .top-menu {
            max-width: 600px;
            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 상단 버튼 */
        .home-button {
            display: inline-block;

            padding: 11px 16px;

            background-color: #ffffff;
            color: #333;

            text-decoration: none;

            border-radius: 10px;

            font-size: 14px;
            font-weight: bold;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            transition: transform 0.1s;
        }

        .home-button:active {
            transform: scale(0.97);
        }

        /* 안내 메시지 전체 영역 */
        .notice-area {
            max-width: 600px;
            margin: 0 auto 25px;
        }

        /* 환영 메시지 */
        .welcome-message {
            background-color: #eaf2ff;
            color: #2454a6;

            border-radius: 12px;

            padding: 16px 18px;
            margin-bottom: 12px;

            text-align: center;

            line-height: 1.6;
            font-size: 15px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* 경고 메시지 */
        .warning-message {
            background-color: #fff3cd;
            color: #856404;

            border: 1px solid #ffe69c;
            border-radius: 12px;

            padding: 16px 18px;

            line-height: 1.6;
            font-size: 14px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* 제목 */
        h1 {
            text-align: center;

            margin: 10px 0 25px;

            font-size: 28px;
        }

        /* 방명록 전체 영역 */
        #guestbookList {
            max-width: 600px;
            margin: 0 auto;
        }

        /* 방명록 카드 */
        #guestbookList > div {
            background-color: white;

            border-radius: 15px;

            padding: 20px;
            margin-bottom: 15px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        /* 카드 안의 구분선 숨기기 */
        #guestbookList hr {
            display: none;
        }

        /* 방명록 제목 */
        #guestbookList h3 {
            margin: 0 0 12px;

            font-size: 19px;
        }

        /* 방명록 내용 */
        #guestbookList p {
            margin: 8px 0;

            line-height: 1.5;

            word-break: break-word;
        }

        /* 수정 / 삭제 버튼 */
        button {
            border: none;
            border-radius: 8px;

            padding: 10px 15px;

            margin-top: 10px;
            margin-right: 5px;

            font-size: 14px;

            cursor: pointer;
        }

        /* 첫 번째 버튼 */
        button:first-of-type {
            background-color: #4f7cff;
            color: white;
        }

        /* 두 번째 버튼 */
        button:nth-of-type(2) {
            background-color: #eeeeee;
            color: #333;
        }

        /* 수정 입력창 */
        #guestbookList input,
        #guestbookList select,
        #guestbookList textarea {
            width: 100%;

            padding: 11px;
            margin-top: 6px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-size: 15px;
            font-family: inherit;

            outline: none;
        }

        /* 수정 입력창 선택 시 */
        #guestbookList input:focus,
        #guestbookList select:focus,
        #guestbookList textarea:focus {
            border-color: #4f7cff;
        }

        /* 내용 입력창 크기 조절 */
        #guestbookList textarea {
            resize: vertical;
        }

        /* 모바일 화면 */
        @media (max-width: 480px) {

            body {
                padding: 15px 10px;
            }

            /* 모바일 상단 버튼 */
            .home-button {
                padding: 10px 12px;

                font-size: 13px;

                text-align: center;
            }

            h1 {
                font-size: 24px;
            }

            /* 모바일 방명록 카드 */
            #guestbookList > div {
                padding: 17px;
            }

            /* 모바일 안내 메시지 */
            .welcome-message,
            .warning-message {
                padding: 14px;

                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<!-- 상단 메뉴 -->
<div class="top-menu">

    <!-- 방명록 작성 페이지 -->
    <a href="text.html" class="home-button">
        📝 방명록 작성하러가기
    </a>

    <!-- 관리자 페이지 -->
    <a href="admin.html" class="home-button">
        🔐 관리자
    </a>

</div>

<!-- 상단 안내 메시지 -->
<div class="notice-area">

    <!-- 환영 메시지 -->
    <div class="welcome-message">
        👋 방명록에 오신 것을 환영합니다!<br>
        여러분의 소중한 의견을 자유롭게 남겨주세요.
    </div>

    <!-- 경고 메시지 -->
    <div class="warning-message">
        ⚠️ <strong>방명록 이용 안내</strong><br>
        욕설, 비방, 광고 또는 다른 사람에게 불쾌감을 줄 수 있는
        부적절한 글은 관리자에 의해 삭제될 수 있습니다.
    </div>

</div>

<!-- 페이지 제목 -->
<h1>💬 방명록 목록</h1>

<!-- 방명록이 표시되는 공간 -->
<div id="guestbookList"></div>

<!-- 방명록 목록 JavaScript -->
<script src="test.js"></script>

</body>

</html>
