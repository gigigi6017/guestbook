
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 휴대폰 화면에 맞게 표시 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>방명록</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 15px;

            background-color: #f5f6f8;

            font-family:
                    Arial,
                    "Noto Sans KR",
                    sans-serif;

            color: #333;
        }

        /* 상단 메뉴 */
        .top-menu {
            max-width: 600px;
            margin: 0 auto 20px;
        }

        /* 메인으로 돌아가기 */
        .home-button {
            display: inline-block;

            padding: 11px 16px;

            background-color: #ffffff;
            color: #333;

            text-decoration: none;

            border-radius: 10px;

            font-size: 14px;
            font-weight: bold;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .home-button:active {
            transform: scale(0.97);
        }

        /* 제목 */
        h1 {
            text-align: center;
            margin: 10px 0 25px;

            font-size: 28px;
        }

        /* 방명록 전체 영역 */
        #guestbookList {
            max-width: 600px;
            margin: 0 auto;
        }

        /* 방명록 카드 */
        #guestbookList > div {
            background-color: white;

            border-radius: 15px;

            padding: 20px;
            margin-bottom: 15px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        #guestbookList hr {
            display: none;
        }

        #guestbookList h3 {
            margin: 0 0 12px;
            font-size: 19px;
        }

        #guestbookList p {
            margin: 8px 0;
            line-height: 1.5;
            word-break: break-word;
        }

        /* 수정 / 삭제 버튼 */
        button {
            border: none;
            border-radius: 8px;

            padding: 10px 15px;
            margin-top: 10px;
            margin-right: 5px;

            font-size: 14px;
            cursor: pointer;
        }

        button:first-of-type {
            background-color: #4f7cff;
            color: white;
        }

        button:nth-of-type(2) {
            background-color: #eeeeee;
            color: #333;
        }

        /* 수정 입력창 */
        #guestbookList input,
        #guestbookList select,
        #guestbookList textarea {
            width: 100%;

            padding: 11px;
            margin-top: 6px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        #guestbookList input:focus,
        #guestbookList select:focus,
        #guestbookList textarea:focus {
            border-color: #4f7cff;
        }

        #guestbookList textarea {
            resize: vertical;
        }

        /* 모바일 */
        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }

            h1 {
                font-size: 24px;
            }

            #guestbookList > div {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

<!-- 메인 페이지로 이동하는 버튼 -->
<div class="top-menu">
    <a href="text.html" class="home-button">
        📝 방문록 작성하로가기
    </a>
</div>

<h1>💬 방명록</h1>

<!-- 방명록이 표시되는 공간 -->
<div id="guestbookList"></div>

<script src="test.js"></script>

</body>
</html>
